services:
  discord-bot:
    build: .
    container_name: labs-discord-bot
    restart: unless-stopped
    environment:
      - Discord__Token=${DISCORD_TOKEN}
      # Map each guild to its own n8n webhook:
      # WEBHOOKS__<GuildId>=<webhook-url>
      - Webhooks__${GUILD_ID_1}=${WEBHOOK_URL_1:-}
      - Webhooks__${GUILD_ID_2}=${WEBHOOK_URL_2:-}
      - Webhooks__${GUILD_ID_3}=${WEBHOOK_URL_3:-}
